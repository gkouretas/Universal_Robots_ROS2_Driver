---
dynamic_path_force_mode_controller:
  speed_scaling_interface_name: {
    type: string,
    default_value: "speed_scaling/speed_scaling_factor",
    description: "Fully qualified name of the speed scaling interface name"
  }
  tf_prefix: {
    type: string,
    default_value: "",
    description: "Urdf prefix of the corresponding arm"
  }
  check_io_successful_retries: {
    type: int,
    default_value: 10,
    description: "Amount of retries for checking if setting dynamic force_mode was successful"
  }
  joints: {
    type: string_array,
    default_value: [],
    description: "Joint names to claim and listen to",
    read_only: true,
    validation: {
      unique<>: null,
    }
  }